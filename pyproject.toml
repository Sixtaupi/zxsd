[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zxsdc"
dynamic = ["version"]
description = "Host compiler that turns a supported XML Schema 1.0 subset into C descriptor tables for the zxsd runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sixtaupi" }]
keywords = ["xsd", "xml-schema", "validation", "embedded", "code-generator", "zephyr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Text Processing :: Markup :: XML",
]

[project.urls]
Homepage = "https://github.com/Sixtaupi/zxsd"
Source = "https://github.com/Sixtaupi/zxsd"
Issues = "https://github.com/Sixtaupi/zxsd/issues"

[project.scripts]
zxsdc = "zxsdc:main"

# CMakeLists.txt is the single source of truth for the project version.
[tool.hatch.version]
path = "CMakeLists.txt"
pattern = "project\\(zxsd VERSION (?P<version>[0-9.]+)"

[tool.hatch.build.targets.sdist]
only-include = ["zxsdc", "zxsdc_lib", "CMakeLists.txt", "README.md", "LICENSE", "pyproject.toml"]

# Keep the extensionless source-tree launcher while installing the implementation
# package under the public `zxsdc` import name.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"zxsdc_lib" = "zxsdc"
