CONFIG_ZTEST=y
# Streaming state and the bounded regex workspace both live on the ztest thread
# stack. Keep their complete default workspace available in validation tests.
CONFIG_ZTEST_STACK_SIZE=131072
# The shared identity and binding tests deliberately inject malloc/free as an
# application-owned scratch allocator. This heap belongs to the test harness;
# CONFIG_MXSD_NO_HEAP still prevents implicit allocation by the runtime.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288

CONFIG_MXSD=y
CONFIG_MXSD_NO_HEAP=y
CONFIG_MXSD_BINDINGS=y
CONFIG_MXSD_MAX_INPUT=8192
CONFIG_MXSD_MAX_IDENTITY_VALUES=8
CONFIG_MXSD_MAX_TEXT_LENGTH=128
