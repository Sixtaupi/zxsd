name: Conformance

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal:
    name: Internal positive and negative suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZXSD_USE_MXML=OFF
          cmake --build build --parallel
      - name: Run conformance gate
        run: ctest --test-dir build -R '^zxsd_conformance_report$' --output-on-failure
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: internal-conformance-report
          path: build/conformance-report.json
          if-no-files-found: error

  w3c:
    name: W3C XSD 1.0 (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'smoke' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/w3c
          key: w3c-xsts-2007-06-20-902176b2

      - name: Fetch pinned W3C suite
        run: python tests/w3c/fetch.py .cache/w3c

      - name: Run W3C suite
        id: w3c
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" != "schedule" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            args+=(--limit 500)
          fi
          python tests/w3c/run.py \
            --suite .cache/w3c/xmlschema2006-11-06 \
            --work-dir build/w3c \
            --output build/w3c-xsd10-report.json \
            --html build/w3c-xsd10-report.html \
            "${args[@]}"

      - name: Analyze gaps
        if: always()
        run: |
          python tests/w3c/summarize.py build/w3c-xsd10-report.json \
            --json build/w3c-xsd10-summary.json \
            --markdown build/w3c-xsd10-summary.md
          cat build/w3c-xsd10-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## W3C XSD 1.0"
            echo
            echo "- Inventory: $(jq -r '.inventory_count' build/w3c-xsd10-report.json)"
            echo "- Counts: \`$(jq -cS '.counts' build/w3c-xsd10-report.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: w3c-xsd10-${{ github.event_name }}-report
          path: |
            build/w3c-xsd10-report.json
            build/w3c-xsd10-report.html
            build/w3c-xsd10-summary.json
            build/w3c-xsd10-summary.md
          if-no-files-found: error
