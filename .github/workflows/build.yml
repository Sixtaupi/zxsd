name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        shared: [OFF, ON]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DZXSD_USE_MXML=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Validate pkg-config metadata
        if: runner.os == 'Linux'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/install/lib/pkgconfig
        run: |
          pkg-config --validate zxsd
          test "$(pkg-config --modversion zxsd)" = "0.20.0"

      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/package-consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Build installed-package consumer
        run: cmake --build build-consumer --config Release --parallel

      - name: Test installed-package consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure --timeout 120

      - name: Configure host sample
        run: >-
          cmake -S samples/host -B build-sample
          -DCMAKE_BUILD_TYPE=Release
          -DZXSD_USE_MXML=OFF

      - name: Build host sample
        run: cmake --build build-sample --config Release --parallel

      - name: Run host sample
        run: ctest --test-dir build-sample -C Release --output-on-failure

  no-heap:
    name: Linux / no heap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DZXSD_USE_MXML=OFF
          -DZXSD_NO_HEAP=ON
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DZXSD_USE_MXML=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --timeout 120

  mini-xml:
    name: Linux / Mini-XML 4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zxsd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: michaelrsweet/mxml
          ref: v4.0.4
          path: mxml

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build Mini-XML
        working-directory: mxml
        run: |
          ./configure --prefix="${RUNNER_TEMP}/mxml"
          make --jobs="$(nproc)"
          make install

      - name: Configure zxsd with the required Mini-XML backend
        working-directory: zxsd
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DZXSD_USE_MXML=ON
          -DZXSD_REQUIRE_MXML=ON
          -DMXML_INCLUDE_DIR="${RUNNER_TEMP}/mxml/include/libmxml4"
          -DMXML_LIBRARY="${RUNNER_TEMP}/mxml/lib/libmxml4.a"

      - name: Build and test
        working-directory: zxsd
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --timeout 120

  zephyr:
    name: Zephyr / qemu_x86
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zxsd

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Zephyr workspace and SDK
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: zxsd
          toolchains: x86_64-zephyr-elf

      - name: Run Zephyr validation tests
        run: west twister -T zxsd/tests/zephyr -p qemu_x86 --inline-logs

      - name: Run Zephyr XSD validation sample
        run: west twister -T zxsd/samples/zephyr/xsd-validation -p qemu_x86 --inline-logs

      - name: Run Zephyr streaming bindings sample
        run: west twister -T zxsd/samples/zephyr/bindings-stream -p qemu_x86 --inline-logs

      - name: Build Zephyr REST sample
        run: west twister -T zxsd/samples/zephyr/rest -p qemu_x86 --build-only --inline-logs

      - name: Build native_sim resource image
        run: >-
          west build -b native_sim zxsd/samples/zephyr/xsd-validation
          -d build-native -- -DEXTRA_CFLAGS=-fstack-usage

      - name: Measure native_sim resources
        shell: bash
        run: |
          runtime_archive=$(find build-native/modules/zxsd -maxdepth 1 -type f -name '*.a' -print -quit)
          generated_object=$(find build-native -type f -name 'device.zxsd.c.obj' -print -quit)
          mapfile -t stack_usage < <(find build-native -type f -name '*.su' -print)
          test -n "$runtime_archive"
          test -n "$generated_object"
          test "${#stack_usage[@]}" -gt 0
          python zxsd/tools/measure_resources.py \
            --platform native_sim \
            --size-tool size \
            --runtime-object "$runtime_archive" \
            --generated-object "$generated_object" \
            --elf build-native/zephyr/zephyr.elf \
            --stack-usage "${stack_usage[@]}" \
            --zero-heap \
            --output native-sim-resources.json
          echo '## native_sim resources' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat native-sim-resources.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-sim-resource-report
          path: native-sim-resources.json
          if-no-files-found: error
