name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Conformance
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build Doxygen and Sphinx
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    concurrency:
      group: documentation-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify conformance and documentation revisions match
        if: github.event_name == 'workflow_run'
        env:
          CONFORMANCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          documentation_sha="$(git rev-parse HEAD)"
          if [[ "$documentation_sha" != "$CONFORMANCE_SHA" ]]; then
            printf 'Conformance tested %s, but documentation uses %s\n' \
              "$CONFORMANCE_SHA" "$documentation_sha" >&2
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Download W3C report from this conformance run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: w3c-xsd10-*-report
          path: build/w3c-report
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Stage W3C report for Sphinx
        if: github.event_name == 'workflow_run'
        run: |
          test -s build/w3c-report/w3c-xsd10-report.html
          cp build/w3c-report/w3c-xsd10-report.html doc/_static/w3c-xsd10-report.html

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz
          python -m pip install --disable-pip-version-check -r doc/requirements.txt

      - name: Build documentation
        run: make -C doc html SPHINXOPTS="-W --keep-going"

      - name: Assemble site
        run: |
          mkdir site
          cp -R doc/_build_sphinx/html/. site/
          cp -R doc/_build_doxygen/html site/doxygen
          touch site/.nojekyll

      - name: Upload documentation archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mxsd-documentation-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_run'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name == 'workflow_run'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

