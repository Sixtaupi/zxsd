name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Conformance
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build Doxygen and Sphinx
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    concurrency:
      group: documentation-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Locate latest complete W3C report
        id: w3c-report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq_filter='[.[] | select(.conclusion == "success" and
            (.event == "schedule" or .event == "workflow_dispatch"))]
            [0].databaseId // empty'
          run_id="$(
            gh run list \
              --workflow conformance.yml \
              --branch "${{ github.event.repository.default_branch }}" \
              --status completed \
              --limit 100 \
              --json databaseId,conclusion,event \
              --jq "$jq_filter"
          )"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download latest complete W3C report
        if: steps.w3c-report.outputs.run-id != ''
        uses: actions/download-artifact@v6
        with:
          pattern: w3c-xsd10-*-report
          path: build/w3c-report
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.w3c-report.outputs.run-id }}

      - name: Stage W3C report for Sphinx
        if: steps.w3c-report.outputs.run-id != ''
        run: |
          test -s build/w3c-report/w3c-xsd10-report.html
          cp build/w3c-report/w3c-xsd10-report.html doc/_static/w3c-xsd10-report.html

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz
          python -m pip install --disable-pip-version-check -r doc/requirements.txt

      - name: Build documentation
        run: make -C doc html SPHINXOPTS="-W --keep-going"

      - name: Assemble site
        run: |
          mkdir site
          cp -R doc/_build_sphinx/html/. site/
          cp -R doc/_build_doxygen/html site/doxygen
          touch site/.nojekyll

      - name: Upload documentation archive
        uses: actions/upload-artifact@v6
        with:
          name: mxsd-documentation-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_run'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_run'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

