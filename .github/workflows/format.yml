name: Code format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
          python -m pip install --disable-pip-version-check black==26.3.1

      - name: Check C formatting
        run: >-
          clang-format-18 --dry-run --Werror
          src/*.c src/*.h include/*.h
          samples/host/*.c samples/zephyr/src/*.c
          tests/test_*.c tests/w3c/runner.c.in

      - name: Check Python formatting
        run: black --check --line-length 100 mxsdc tests tools doc/conf.py
