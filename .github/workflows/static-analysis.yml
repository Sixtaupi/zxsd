name: Static analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cppcheck:
    name: Static analysis (Cppcheck and flawfinder)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Cppcheck image
        id: cppcheck_image
        run: >-
          docker build --target runtime
          --tag zxsd-cppcheck:ci
          tools/docker/cppcheck

      - name: Analyze C sources
        shell: bash
        run: |
          set +e
          docker run --rm \
            --volume "${{ github.workspace }}:${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            zxsd-cppcheck:ci \
            sh -c '
              cmake -S . -B build-misra \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DZXSD_BUILD_TESTS=OFF \
                -DZXSD_NO_HEAP=ON \
                -DZXSD_USE_MXML=OFF &&
              cppcheck \
                --project=build-misra/compile_commands.json \
                --dump \
                --max-configs=1 &&
              find src -name "*.dump" -print0 |
                xargs -0 python3 /usr/local/share/Cppcheck/addons/misra.py \
                  --rule-texts=/usr/local/share/Cppcheck/addons/misra2023_rules_ascii.txt \
                  --junit-file-export=build-misra/misra_report.xml
            '
          status=$?
          cat build-misra/misra_report.xml
          exit 0

      - name: Analyze C sources with Flawfinder
        if: ${{ always() && steps.cppcheck_image.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          docker run --rm \
            --volume "${{ github.workspace }}:${{ github.workspace }}:ro" \
            --workdir "${{ github.workspace }}" \
            zxsd-cppcheck:ci \
            flawfinder \
              --columns \
              --context \
              --error-level=4 \
              --omittime \
              include src \
              >flawfinder.txt
          status=$?
          cat flawfinder.txt
          exit "$status"

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: static-analysis-reports
          path: |
            build-misra/misra_report.xml
            flawfinder.txt
          if-no-files-found: warn
