name: Fuzz smoke tests

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Atheris 2.3.0 does not build on Python 3.12 or newer.
          python-version: "3.11"

      - name: Build XML libFuzzer target
        env:
          CC: clang
        run: >-
          cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DZXSD_USE_MXML=OFF
          -DZXSD_BUILD_TESTS=OFF
          -DZXSD_BUILD_FUZZERS=ON

      - name: Compile XML libFuzzer target
        run: cmake --build build-fuzz --parallel

      - name: Fuzz portable XML validation
        run: >-
          build-fuzz/bin/zxsd_xml_fuzzer fuzz/corpus/xml
          -runs=10000 -max_len=4096 -timeout=10

      - name: Install Atheris
        run: python -m pip install --disable-pip-version-check atheris==2.3.0

      - name: Fuzz zxsdc
        run: >-
          python fuzz/fuzz_zxsdc.py fuzz/corpus/xsd
          -runs=5000 -max_len=262144 -timeout=10
