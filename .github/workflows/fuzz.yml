name: Fuzz smoke tests

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Atheris 2.3.0 does not build on Python 3.12 or newer.
          python-version: "3.11"

      - name: Build XML libFuzzer target
        env:
          CC: clang
        run: >-
          cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DMXSD_USE_MXML=OFF
          -DMXSD_BUILD_TESTS=OFF
          -DMXSD_BUILD_FUZZERS=ON

      - name: Compile XML libFuzzer target
        run: cmake --build build-fuzz --parallel

      - name: Fuzz portable XML validation
        run: >-
          build-fuzz/bin/mxsd_xml_fuzzer fuzz/corpus/xml
          -runs=10000 -max_len=4096 -timeout=10

      - name: Install Atheris
        run: python -m pip install --disable-pip-version-check atheris==2.3.0

      - name: Fuzz mxsdc
        run: >-
          python fuzz/fuzz_mxsdc.py fuzz/corpus/xsd
          -runs=5000 -max_len=262144 -timeout=10
