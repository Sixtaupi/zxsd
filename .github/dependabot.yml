version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/tools/docker/cppcheck"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/.github/requirements"
      - "/doc"
      - "/tools/docker/cppcheck"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns:
          - "*"
