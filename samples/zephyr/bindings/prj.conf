CONFIG_MXSD=y
CONFIG_MXSD_BINDINGS=y

# Validation keeps per-level text buffers sized by this limit on the stack.
# The longest value of this schema is 32 characters, so 128 bytes is enough
# and keeps the stack small; the default of 1024 needs about 26 KiB here.
CONFIG_MXSD_MAX_TEXT_LENGTH=128

# Measured peak on qemu_x86 with the settings above: about 15.7 KiB, reached
# during validation. Reading the structures afterwards adds about 100 bytes.
CONFIG_MAIN_STACK_SIZE=30480
# Turn a stack overflow into an immediate fault instead of silent corruption.
CONFIG_HW_STACK_PROTECTION=y
