sample:
  name: zxsd typed bindings
  description: Read, update and write XML settings through generated C structures
tests:
  zxsd.bindings:
    tags:
      - xml
      - bindings
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "read: version 3, mode performance, 2 sensor\\(s\\)"
        - "sensor 2 \"Room & hallway humidity\": every 2000 ms, disabled"
        - "write: ok, [0-9]+ bytes"
        - "<ns1:sensor id=\"3\"><ns1:label>Outdoor pressure</ns1:label>"
        - "validate: ok"
        - "rejected: incorrect element order \\(settings\\)"
        - "refused: missing required element \\(label\\)"
        - "zxsd bindings sample done"
