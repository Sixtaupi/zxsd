sample:
  name: mxsd Mini-XML validation
  description: Validate Mini-XML trees against a schema compiled on the build host
tests:
  mxsd.xsd_validation_mxml:
    tags:
      - xml
      - validation
    # Skipped when no Mini-XML Zephyr module is present in the workspace.
    modules:
      - mxml
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "valid document: valid"
        - "invalid document: invalid, incorrect element order \\(device\\)"
        - "mxsd Mini-XML validation sample done"
