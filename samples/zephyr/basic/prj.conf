CONFIG_ZTEST=y
# The default complete-regex workspace is bounded but intentionally lives on
# the caller's stack. Applications that lower CONFIG_MXSD_MAX_REGEX_NODES can
# lower this value after measuring their own schemas. ZTEST cases run on the
# ztest thread, so its stack must hold the workspace, not the main stack.
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MXSD=y
