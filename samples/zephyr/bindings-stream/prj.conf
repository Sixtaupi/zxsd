CONFIG_MXSD=y
CONFIG_MXSD_BINDINGS=y

# Schema-derived limits, reviewed from the output of:
#   python3 mxsdc settings.xsd -o generated --bindings \
#       --stream-bind settings/sensor --zephyr-config
# mxsd_generate(... ZEPHYR_CONFIG) regenerates the matching checks at build
# time: compilation fails if a value drops below what settings.xsd requires.
CONFIG_MXSD_MAX_ATTRIBUTES=2
CONFIG_MXSD_MAX_DEPTH=3
CONFIG_MXSD_MAX_PARTICLES=3
CONFIG_MXSD_MAX_PATTERN_LENGTH=1
CONFIG_MXSD_MAX_REGEX_DEPTH=1
CONFIG_MXSD_MAX_REGEX_NODES=16
CONFIG_MXSD_MAX_SCHEMA_COMPLEXITY=10
CONFIG_MXSD_STREAM_CHILD_CAPACITY=1
CONFIG_MXSD_STREAM_MODEL_CAPACITY=0
CONFIG_MXSD_STREAM_NAME_CAPACITY=42

# Application budgets, which the XSD cannot bound.
# Total bytes accepted by one reader across all fragments; the largest
# document of this sample is the 519-byte written output.
CONFIG_MXSD_MAX_INPUT=1024
# Longest incomplete tag or text kept between two fragments. The longest tag
# here is the root start tag, about 60 bytes.
CONFIG_MXSD_XML_TOKEN_CAPACITY=128
# Per-level text buffers; the longest value of this schema is 32 characters.
CONFIG_MXSD_MAX_TEXT_LENGTH=128

# Readers and validators are static; the stack holds the call chain and the
# sensor table of main(). This size is a conservative default; measure with
# CONFIG_INIT_STACKS before lowering it.
CONFIG_MAIN_STACK_SIZE=16384
# Turn a stack overflow into an immediate fault instead of silent corruption.
CONFIG_HW_STACK_PROTECTION=y
