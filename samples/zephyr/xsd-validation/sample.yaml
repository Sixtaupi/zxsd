sample:
  name: zxsd XSD validation
  description: Validate XML documents against a schema compiled on the build host
tests:
  zxsd.xsd_validation:
    tags: 
      - xml
      - validation
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "valid document: valid"
        - "invalid document: invalid, missing required element \\(device\\)"
        - "zxsd XSD validation sample done"
