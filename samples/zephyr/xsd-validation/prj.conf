CONFIG_MXSD=y

# Schema-derived limits, reviewed from the output of:
#   python3 mxsdc device.xsd -o generated --zephyr-config
# mxsd_generate(... ZEPHYR_CONFIG) regenerates the matching checks at build
# time: compilation fails if a value drops below what device.xsd requires.
CONFIG_MXSD_MAX_ATTRIBUTES=1
CONFIG_MXSD_MAX_DEPTH=2
CONFIG_MXSD_MAX_PARTICLES=3
CONFIG_MXSD_MAX_PATTERN_LENGTH=1
CONFIG_MXSD_MAX_REGEX_DEPTH=1
CONFIG_MXSD_MAX_REGEX_NODES=16
CONFIG_MXSD_MAX_SCHEMA_COMPLEXITY=10
CONFIG_MXSD_STREAM_CHILD_CAPACITY=1
CONFIG_MXSD_STREAM_MODEL_CAPACITY=0
CONFIG_MXSD_STREAM_NAME_CAPACITY=42

# Application budgets, which the XSD cannot bound. Validation keeps per-level
# text buffers sized by CONFIG_MXSD_MAX_TEXT_LENGTH on the stack.
CONFIG_MXSD_MAX_INPUT=256
CONFIG_MXSD_MAX_TEXT_LENGTH=128

# The bounded validation workspace lives on the main thread stack. This size
# is a conservative default; measure with CONFIG_INIT_STACKS before lowering it.
CONFIG_MAIN_STACK_SIZE=16384
# Turn a stack overflow into an immediate fault instead of silent corruption.
CONFIG_HW_STACK_PROTECTION=y
